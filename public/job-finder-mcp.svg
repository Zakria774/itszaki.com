<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="jobBg" cx="20%" cy="75%" r="80%">
      <stop offset="0%" stop-color="#efe3ff" />
      <stop offset="100%" stop-color="#faf5ea" />
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#jobBg)" />

  <!-- faint dot grid, series consistency -->
  <g fill="#0a0a0a" opacity="0.06">
    <circle cx="700" cy="380" r="2.5"/><circle cx="740" cy="380" r="2.5"/>
    <circle cx="700" cy="340" r="2.5"/><circle cx="740" cy="340" r="2.5"/>
    <circle cx="60" cy="60" r="2.5"/><circle cx="100" cy="60" r="2.5"/>
  </g>

  <!-- job listings card -->
  <g transform="translate(150,110)">
    <rect x="0" y="0" width="330" height="250" rx="18" fill="#ffffff" stroke="#0a0a0a" stroke-opacity="0.08"/>

    <!-- window controls -->
    <circle cx="26" cy="26" r="5" fill="#0a0a0a" opacity="0.15"/>
    <circle cx="44" cy="26" r="5" fill="#0a0a0a" opacity="0.15"/>
    <circle cx="62" cy="26" r="5" fill="#0a0a0a" opacity="0.15"/>

    <!-- listing rows -->
    <g transform="translate(24,56)">
      <rect x="0" y="0" width="282" height="52" rx="10" fill="#7C3AED" opacity="0.08"/>
      <rect x="16" y="14" width="120" height="9" rx="4" fill="#0a0a0a" opacity="0.75"/>
      <rect x="16" y="30" width="80" height="7" rx="3.5" fill="#0a0a0a" opacity="0.3"/>
      <circle cx="256" cy="26" r="12" fill="#7C3AED"/>
      <path d="M251 26 L255 30 L262 21" fill="none" stroke="#faf5ea" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(24,120)">
      <rect x="0" y="0" width="282" height="52" rx="10" fill="#0a0a0a" opacity="0.04"/>
      <rect x="16" y="14" width="150" height="9" rx="4" fill="#0a0a0a" opacity="0.55"/>
      <rect x="16" y="30" width="90" height="7" rx="3.5" fill="#0a0a0a" opacity="0.22"/>
      <circle cx="256" cy="26" r="12" fill="#0a0a0a" opacity="0.15"/>
    </g>

    <g transform="translate(24,184)">
      <rect x="0" y="0" width="282" height="52" rx="10" fill="#0a0a0a" opacity="0.04"/>
      <rect x="16" y="14" width="100" height="9" rx="4" fill="#0a0a0a" opacity="0.55"/>
      <rect x="16" y="30" width="70" height="7" rx="3.5" fill="#0a0a0a" opacity="0.22"/>
      <circle cx="256" cy="26" r="12" fill="#0a0a0a" opacity="0.15"/>
    </g>
  </g>

  <!-- magnifying glass scanning the listings -->
  <g transform="translate(430,330)">
    <circle r="34" fill="none" stroke="#0a0a0a" stroke-width="10"/>
    <line x1="24" y1="24" x2="52" y2="52" stroke="#0a0a0a" stroke-width="12" stroke-linecap="round"/>
    <circle r="34" fill="#faf5ea" opacity="0.001"/>
  </g>

  <!-- MCP plug / connector icon -->
  <g transform="translate(600,140)">
    <rect x="-40" y="-26" width="80" height="52" rx="14" fill="#0a0a0a"/>
    <circle cx="-14" cy="0" r="7" fill="#faf5ea"/>
    <circle cx="14" cy="0" r="7" fill="#7C3AED"/>
    <line x1="-14" y1="0" x2="14" y2="0" stroke="#faf5ea" stroke-width="3" opacity="0.5"/>
  </g>
  <text x="600" y="182" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#0a0a0a" text-anchor="middle" opacity="0.55">MCP</text>

  <!-- briefcase icon -->
  <g transform="translate(650,300)">
    <rect x="-28" y="-14" width="56" height="40" rx="6" fill="#7C3AED"/>
    <rect x="-12" y="-24" width="24" height="12" rx="4" fill="none" stroke="#7C3AED" stroke-width="5"/>
    <line x1="-28" y1="4" x2="28" y2="4" stroke="#faf5ea" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- AI spark accent -->
  <g transform="translate(530,90)">
    <path d="M0 -14 L4 -4 L14 0 L4 4 L0 14 L-4 4 L-14 0 L-4 -4 Z" fill="#7C3AED"/>
  </g>
</svg>
