<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="raceBg" cx="75%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#efe3ff" />
      <stop offset="100%" stop-color="#faf5ea" />
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#raceBg)" />

  <!-- faint dot grid, series consistency -->
  <g fill="#0a0a0a" opacity="0.06">
    <circle cx="80" cy="70" r="2.5"/><circle cx="120" cy="70" r="2.5"/>
    <circle cx="80" cy="110" r="2.5"/><circle cx="120" cy="110" r="2.5"/>
  </g>

  <!-- winding track -->
  <path d="M -20 380 C 160 380 160 260 320 260 S 480 140 640 140 S 760 60 840 60"
        fill="none" stroke="#0a0a0a" stroke-width="46" stroke-linecap="round" opacity="0.9"/>
  <path d="M -20 380 C 160 380 160 260 320 260 S 480 140 640 140 S 760 60 840 60"
        fill="none" stroke="#faf5ea" stroke-width="4" stroke-dasharray="14 14" opacity="0.9"/>

  <!-- checkered finish flag -->
  <g transform="translate(660,120)">
    <rect x="0" y="-40" width="3" height="80" fill="#0a0a0a"/>
    <g transform="translate(3,-40)">
      <rect x="0" y="0" width="12" height="12" fill="#0a0a0a"/>
      <rect x="12" y="0" width="12" height="12" fill="#faf5ea"/>
      <rect x="0" y="12" width="12" height="12" fill="#faf5ea"/>
      <rect x="12" y="12" width="12" height="12" fill="#0a0a0a"/>
      <rect x="0" y="24" width="12" height="12" fill="#0a0a0a"/>
      <rect x="12" y="24" width="12" height="12" fill="#faf5ea"/>
    </g>
  </g>

  <!-- car (flat, top-down-ish silhouette) -->
  <g transform="translate(300,262) rotate(-8)">
    <rect x="-46" y="-16" width="92" height="32" rx="12" fill="#7C3AED"/>
    <rect x="-26" y="-24" width="52" height="20" rx="8" fill="#0a0a0a"/>
    <rect x="-16" y="-19" width="14" height="10" rx="2" fill="#efe3ff" opacity="0.8"/>
    <rect x="2" y="-19" width="14" height="10" rx="2" fill="#efe3ff" opacity="0.8"/>
    <circle cx="-28" cy="16" r="9" fill="#0a0a0a"/>
    <circle cx="28" cy="16" r="9" fill="#0a0a0a"/>
    <circle cx="-28" cy="16" r="3.5" fill="#faf5ea"/>
    <circle cx="28" cy="16" r="3.5" fill="#faf5ea"/>
    <rect x="44" y="-6" width="10" height="4" rx="2" fill="#0a0a0a" opacity="0.6"/>
  </g>

  <!-- motion lines behind the car -->
  <g stroke="#0a0a0a" stroke-width="3" stroke-linecap="round" opacity="0.35">
    <line x1="200" y1="250" x2="240" y2="250"/>
    <line x1="190" y1="264" x2="235" y2="264"/>
    <line x1="205" y1="278" x2="240" y2="278"/>
  </g>

  <!-- code brackets accent, nods to C++/OOP -->
  <g transform="translate(120,150)" fill="none" stroke="#0a0a0a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M14 0 L0 20 L14 40"/>
    <path d="M54 0 L68 20 L54 40"/>
  </g>
  <g transform="translate(140,168)">
    <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#7C3AED"/>
  </g>
</svg>
