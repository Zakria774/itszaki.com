<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="nomaBg" cx="25%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#efe3ff" />
      <stop offset="100%" stop-color="#faf5ea" />
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#nomaBg)" />

  <!-- faint grid dots, echoes travel-planner illustration for series consistency -->
  <g fill="#0a0a0a" opacity="0.06">
    <circle cx="700" cy="60" r="2.5"/><circle cx="740" cy="60" r="2.5"/>
    <circle cx="700" cy="100" r="2.5"/><circle cx="740" cy="100" r="2.5"/>
    <circle cx="60" cy="390" r="2.5"/><circle cx="100" cy="390" r="2.5"/>
  </g>

  <!-- main dashboard card -->
  <g transform="translate(160,110)">
    <rect x="0" y="0" width="420" height="260" rx="18" fill="#ffffff" stroke="#0a0a0a" stroke-opacity="0.08"/>

    <!-- window controls -->
    <circle cx="26" cy="26" r="5" fill="#0a0a0a" opacity="0.15"/>
    <circle cx="44" cy="26" r="5" fill="#0a0a0a" opacity="0.15"/>
    <circle cx="62" cy="26" r="5" fill="#0a0a0a" opacity="0.15"/>

    <!-- header label -->
    <rect x="24" y="48" width="120" height="10" rx="5" fill="#0a0a0a" opacity="0.7"/>
    <rect x="24" y="64" width="70" height="7" rx="3.5" fill="#0a0a0a" opacity="0.25"/>

    <!-- bar chart -->
    <g transform="translate(24,110)">
      <rect x="0"   y="70" width="26" height="60" rx="4" fill="#7C3AED" opacity="0.35"/>
      <rect x="36"  y="50" width="26" height="80" rx="4" fill="#7C3AED" opacity="0.55"/>
      <rect x="72"  y="20" width="26" height="110" rx="4" fill="#7C3AED"/>
      <rect x="108" y="40" width="26" height="90" rx="4" fill="#7C3AED" opacity="0.7"/>
      <rect x="144" y="60" width="26" height="70" rx="4" fill="#7C3AED" opacity="0.4"/>
    </g>

    <!-- side summary card -->
    <g transform="translate(230,110)">
      <rect x="0" y="0" width="166" height="130" rx="12" fill="#0a0a0a"/>
      <rect x="18" y="20" width="70" height="8" rx="4" fill="#faf5ea" opacity="0.6"/>
      <rect x="18" y="38" width="100" height="16" rx="4" fill="#faf5ea"/>
      <path d="M18 78 L40 60 L60 72 L90 44 L120 58" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="120" cy="58" r="4" fill="#7C3AED"/>
    </g>
  </g>

  <!-- floating coin / currency icon -->
  <g transform="translate(620,150)">
    <circle r="34" fill="#7C3AED"/>
    <text x="0" y="10" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#faf5ea" text-anchor="middle">$</text>
  </g>

  <!-- AI spark accent -->
  <g transform="translate(660,260)">
    <path d="M0 -16 L4 -4 L16 0 L4 4 L0 16 L-4 4 L-16 0 L-4 -4 Z" fill="#0a0a0a"/>
  </g>
  <g transform="translate(600,300)" opacity="0.5">
    <path d="M0 -9 L3 -3 L9 0 L3 3 L0 9 L-3 3 L-9 0 L-3 -3 Z" fill="#7C3AED"/>
  </g>

  <!-- small trend arrow badge, bottom left -->
  <g transform="translate(120,330)">
    <rect x="-30" y="-20" width="60" height="40" rx="10" fill="#ffffff" stroke="#0a0a0a" stroke-opacity="0.08"/>
    <path d="M-14 6 L-2 -6 L6 2 L14 -10" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M6 -10 L14 -10 L14 -2" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
